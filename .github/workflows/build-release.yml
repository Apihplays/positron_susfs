name: build-release

# Build the ReSukiSU AnyKernel3 zip.
# Triggers:
#   - manually: Actions tab -> "Run workflow" button (workflow_dispatch)
#   - on a v* tag push (creates/attaches a GitHub Release)
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # to create the GitHub Release + upload asset

    steps:
      - name: Checkout repo (with KernelSU submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive   # KernelSU submodule is hard-required by Kbuild

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 zlib1g-dev libxml2-dev

      - name: Download llvm-arm-toolchain-10.0.9
        run: |
          mkdir -p toolchain
          curl -L -o toolchain/llvm-arm-toolchain-ship-10.0.9.tar.gz \
            https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/llvm-arm-toolchain-ship-10.0.9.tar.gz
          tar -xzf toolchain/llvm-arm-toolchain-ship-10.0.9.tar.gz -C toolchain
          # libtinfo.so.5 + libxml2.so.2 are required by the clang-10/ld.lld tools;
          # the build script symlinks them, so ensure the host libs exist.
          ls -la toolchain/llvm-arm-toolchain-ship/10.0.9/bin/clang

      - name: Build kernel + package AnyKernel3 zip
        run: ./build-anykernel.sh "$PWD/toolchain"

      - name: Upload zip as workflow artifact (always)
        uses: actions/upload-artifact@v4
        with:
          name: positron_susfs-veux
          path: positron_susfs-veux-*.zip
          if-no-files-found: error

      - name: Upload zip to GitHub Release (only on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: positron_susfs-veux-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}